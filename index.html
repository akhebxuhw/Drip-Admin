<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Drip Hub · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="bg"></div>

<!-- Password gate -->
<div id="gate" class="gate">
  <div class="gbox glass">
    <div class="lockico"><svg viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="9.5" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg></div>
    <h2>Admin</h2>
    <p class="muted">Enter the password to continue</p>
    <form id="gForm" autocomplete="off">
      <input id="gIn" type="password" placeholder="Password" autocomplete="new-password" required>
      <button class="btn">Unlock</button>
    </form>
    <p id="gErr" class="gerr"></p>
  </div>
</div>

<!-- App -->
<div id="app" class="app hidden">
  <header class="bar glass">
    <div class="logo">DRIP<span>HUB</span><em>ADMIN</em></div>
    <div class="barr"><span id="conn" class="conn">…</span><button id="lock" class="pill glass">Lock</button></div>
  </header>

  <main>
    <div id="err" class="errbox glass hidden">
      <p id="errMsg"></p><small id="errDet"></small>
      <button id="errRetry" class="btn sm">Retry</button>
    </div>

    <section class="panel glass">
      <h3>Brands &amp; categories</h3>
      <form id="brandForm" class="row">
        <input id="brandName" placeholder="Brand name (e.g. Nike)" required>
        <button class="btn sm">Add brand</button>
      </form>
      <div id="brandList"></div>
    </section>

    <section class="panel glass">
      <h3>Add product</h3>
      <form id="prodForm" class="form">
        <label class="drop" id="drop">
          <input type="file" id="pImg" accept="image/*" hidden>
          <img id="pPrev" class="hidden" alt="">
          <span id="dropTxt">Click or drop a product image</span>
        </label>
        <input id="pName" placeholder="Product name" required>
        <input id="pPrice" type="number" step="0.01" min="0" placeholder="Price in QAR" required>
        <textarea id="pDesc" rows="3" placeholder="Description"></textarea>
        <select id="pBrand" required></select>
        <select id="pCat" required></select>
        <button class="btn" id="pSave">Add product</button>
      </form>
    </section>

    <section class="panel glass">
      <div class="phead"><h3>All products <span id="pCount" class="muted"></span></h3>
        <input id="pFind" class="find" placeholder="Filter…"></div>
      <div id="prodList"></div>
    </section>
  </main>
</div>

<div id="toasts"></div>
<script src="admin.js"></script>
</body>
</html>
